[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trust-gate"
dynamic = ["version"]
description = "Deterministic, fail-closed permission tiers (T0-T3) for AI agent tool calls. Standard library only."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Denys" }]
keywords = ["ai-agents", "llm", "tool-calling", "permissions", "prompt-injection", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Dennim89/agent-trust-gate"
Issues = "https://github.com/Dennim89/agent-trust-gate/issues"

[tool.setuptools]
packages = ["trust_gate"]

[tool.setuptools.dynamic]
version = { attr = "trust_gate.__version__" }
